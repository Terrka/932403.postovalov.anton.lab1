<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>Кулинар и фуд-блогер</title>


    </head>

    <body>
        <header>
            <h1>Постовалов</h1>
            <h2>Кулинар и фуд-блогер</h2>
        </header>

        <main>
            <section>
                <h2>Навыки</h2>
                <ul>
                    <li>Приготовление блюд азиатской кухни</li>
                    <li>Создание и оформление рецептов</li>
                    <li>Фотографирование еды</li>
                </ul>
            </section>

            <section>
                <h2>Блюда</h2>
                <ol>
                    <li>Рамен</li>
                    <li>Кимчи</li>
                    <li>Том-ям</li>
                </ol>
            </section>

            <aside>
                <h2>Любимые ингридиенты</h2>
                <p>Лапша</p>
                <p>Яйца</p>
                <p>Мясо</p>
            </aside>

            <section>
                <h2>Обратная связь</h2>
                <form>
                    <label for="name">Имя:</label>
                    <input type="text", id="name", name="name", placeholder="Введите ваше Имя" required>

                    <label for="name">Email:</label>
                    <input type="email", id="email", name="email", placeholder="Введите ваш Email" required>

                    <label for="name">Сообщение:</label>
                    <input type="text", id="message", name="message", placeholder="Введите ваше сообщение" required>
                </form>
            </section>
        </main>
        
        <footer> <!-- Нижняя часть страницы -->
            <p>&copy; 2026 Постовалов</p>
        </footer>
    </body>
</html>
