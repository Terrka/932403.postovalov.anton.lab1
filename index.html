<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        
        <title>Кулинар и фуд-блогер</title>

        <style>
            
        </style>
    </head>

    <body>
        <header>
            <img
            src="images/avatar.png"
            alt="Аватар владельца страницы"
            width="120"
            height="120">
            <div>
                <h1>Постовалов</h1>
                <p>Кулинар и фуд-блогер</p>
            </div>
        </header>

        <main>
            <div class="content">
                <div class="section">
                    <section>
                        <h2>Навыки</h2>
                        <ul>
                            <li>Приготовление блюд азиатской кухни</li>
                            <li>Создание и оформление рецептов</li>
                            <li>Фотографирование еды</li>
                        </ul>
                    </section>

                    <section>
                        <h2>Блюда</h2>
                        <ol>
                            <li>Рамен</li>
                            <li>Кимчи</li>
                            <li>Том-ям</li>
                        </ol>
                    </section>
                </div>
                
                <aside>
                    <h2>Любимые ингридиенты</h2>
                    <p>Лапша</p>
                    <p>Яйца</p>
                    <p>Мясо</p>
                    <p>Зелень</p>
                </aside>
            </div>

            <div class="form">
                <section>
                    <h2>Обратная связь</h2>
                    <form>
                        <label for="name">Имя:</label>
                        <input type="text" id="name" name="name" placeholder="Введите ваше Имя" required>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Введите ваш Email" required>

                        <label for="message">Сообщение:</label>
                        <textarea id="message" rows ="5" name="message" placeholder="Введите ваше сообщение" required></textarea>

                        <button type="submit">Отправить</button>
                    </form>
                </section>
            </div>
        
        </main>
        
        <footer> <!-- Нижняя часть страницы -->
            <p>&copy; 2026 Постовалов</p>
        </footer>
    </body>
</html>
